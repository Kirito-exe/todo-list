<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo-List</title><script defer="defer" src="main.js"></script></head><body><div class="container"><div class="header"><h1>TO DO LIST</h1></div><div class="whole-menu"><div id="menu"><div class="menu-row"><div>Project name</div><button>X</button></div></div><button>Add Project</button></div><div id="content"><div><h2>Tasks</h2><h8>Click project name to see it's details</h8></div><div class="tasks"></div><button id="addTask">Add Task</button></div><div class="footer"><div>Made by Kirito(discord:@rtrd_abhii)</div></div><dialog id="addProject-dialog" closedby="any"><form method="dialog"><h2>Add Project:</h2><div class="form-row"><label for="project-name">Project Name:</label> <input name="project-name" id="project-name" required></div><button type="submit">Submit</button></form></dialog><dialog id="addTask-dialog" closedby="any"><form method="dialog"><div class="form-row"><label for="task-title">Title:</label> <input id="task-title" name="task-title" maxlength="30" required></div><div class="form-row"><label for="task-desc">Description:</label> <input id="task-desc" name="task-desc"></div><div class="form-row"><label for="due-date">Due Date:</label> <input type="date" id="due-date" name="due-date" required></div><div class="form-row"><label for="task-note">Note:</label> <input id="task-note" name="task-note"></div><div class="form-row"><label for="priority">Priority:</label> <input type="range" name="priority" id="priority" min="0" max="10" step="5" value="0"></div><div class="form-row"><label for="project-selection">Which project?</label> <select id="project-selection" name="project"></select></div><button type="submit">Submit</button></form></dialog><dialog id="editTask-dialog" closedby="any"><form method="dialog"><div class="form-row"><label for="task-title">Title:</label> <input id="task-title" name="task-title" maxlength="30" required disabled="disabled"></div><div class="form-row"><label for="task-desc">Description:</label> <input id="task-desc" name="task-desc" disabled="disabled"></div><div class="form-row"><label for="due-date">Due Date:</label> <input type="date" id="due-date" name="due-date" required disabled="disabled"></div><div class="form-row"><label for="task-note">Note:</label> <input id="task-note" name="task-note" disabled="disabled"></div><div class="form-row"><label for="priority"></label> <input type="range" name="priority" id="priority" min="0" max="10" step="5" disabled="disabled"></div><div class="buttons"><button type="button" id="edit-details">Edit</button> <button type="submit" disabled="disabled">Submit</button></div></form></dialog></div></body></html>
