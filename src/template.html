<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-List</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TO DO LIST</h1>
        </div>
        <div class="whole-menu">
            <div id="menu">
                <div class="menu-row">
                    <div>Project name</div>
                    <button>X</button>
                </div>
            </div>
            <button>Add Project</button>
        </div>
        <div id="content">
            <div>Tasks</div>
                <div class="tasks">
                    <div class="task-row">
                        <input type="checkbox" id="task-status" name="taskStatus">
                        <div id="task-title">Something</div>
                        <div id="task-dueDate">some date</div>
                        <button>X</button>
                    </div>
                </div>
            <button>Add Task</button>
        </div>
        <div class="footer">
            <div>Made by Kirito(discord:@rtrd_abhii)</div>
        </div>
        <dialog id="addProject-dialog">
            <form method="dialog">
                <div class="form-row">
                    <label for="project-name">Enter Project Name:</label>
                    <input type="text" id="project-name" name="project-name">
                </div>
                <button type="button">Add</button>
            </form>
        </dialog>
        <dialog id="addTask-dialog">
            <form method="dialog">
                <div class="form-row">
                    <label for="task-title">Title:</label>
                    <input type="text" id="task-title" name="task-title" value="title" required>
                </div>
                <div class="form-row">
                    <label for="task-desc">Description:</label>
                    <input type="text" id="task-desc" name="task-desc" value="description">
                </div>
                <div class="form-row">
                    <label for="due-date">Due Date:</label>
                    <input type="date" id="due-date" name="due-date">
                </div>
                <div class="form-row">
                    <label for="task-note">Note:</label>
                    <input type="text" id="tast-note" name="task-note" value="note">
                </div>
                <div class="form-row">
                    <label for="priority"></label>
                    <input type="range" name="priority" id="priority" min="0" max="10" step="5" value="0">
                </div>
            </form>
        </dialog>
    </div>
</body>
</html>
